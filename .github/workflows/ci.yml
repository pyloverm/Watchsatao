name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        # Sur échantillon figé : la suite ne sort jamais sur le réseau.
        run: npm test
      - name: Build
        run: npm run build
